function radarSvg(vals){
  var W = 460, H = 300, cx = 230, cy = 156, R = 90, n = vals.length;
  function pt(i, r){ var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  var grid = '';
  [0.25, 0.5, 0.75, 1].forEach(function(f){
    grid += '<polygon points="' + vals.map(function(_, i){ return pt(i, R * f).join(','); }).join(' ') + '" fill="' + (f === 1 ? '#FFF7F0' : 'none') + '" stroke="#F2D6CC" stroke-width="1"/>';
  });
  var axes = vals.map(function(_, i){ var p = pt(i, R); return '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#F2D6CC"/>'; }).join('');
  var poly = vals.map(function(v, i){ return pt(i, R * v / 100).join(','); }).join(' ');
  var dots = vals.map(function(v, i){ var p = pt(i, R * v / 100); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#E98272"/>'; }).join('');
  var labels = vals.map(function(v, i){
    var p = pt(i, R + 28), anchor = Math.abs(p[0] - cx) < 4 ? 'middle' : p[0] > cx ? 'start' : 'end';
    var dy = i === 0 ? -8 : 0;
    return '<text x="' + p[0] + '" y="' + (p[1] + dy) + '" text-anchor="' + anchor + '" font-size="15" font-weight="700" fill="#574047">' + esc(STATS[i].nm) + '</text>' +
           '<text x="' + p[0] + '" y="' + (p[1] + dy + 19) + '" text-anchor="' + anchor + '" font-size="17" font-weight="800" fill="#E98272">' + v + '</text>';
  }).join('');
  return '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="5가지 돈 감정 능력치 그래프">' + grid + axes +
    '<polygon points="' + poly + '" fill="rgba(233,130,114,.28)" stroke="#E98272" stroke-width="2.5" stroke-linejoin="round"/>' + dots + labels + '</svg>';
}

function copyText(s){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).then(function(){ return true; }, function(){ return legacyCopy(s); });
  return Promise.resolve(legacyCopy(s));
}
function legacyCopy(s){
  var ta = document.createElement('textarea'); ta.value = s; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta); return ok;
}
function share(type){
  var url = shareUrl(type);
  if (navigator.share) navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: url }).catch(function(){});
  else copyText(SHARE_TEXT + '\n' + url).then(function(ok){ toast(ok ? '공유 문구와 링크를 복사했어요. 카카오톡에 붙여 넣어 주세요.' : '링크를 길게 눌러 복사해 주세요.'); });
}

  if (line) lines.push(line); return lines;
}

    if (second) { y += 76; x.fillStyle = '#E98272'; x.font = '800 54px ' + F; x.fillText('+ ' + second.name, C, y); }
    y += 62; x.fillStyle = '#E98272'; x.font = '700 38px ' + F; x.fillText(t.tag, C, y);
    x.font = '700 34px ' + F; var ql = wrapLines(x, '"' + t.quote + '"', W - 330).slice(0, 3);
    var qh = 46 + ql.length * 50; y += 34;
    x.fillStyle = '#FFF7F0'; roundRect(x, 150, y, W - 300, qh, 28); x.fill();
    x.fillStyle = '#574047'; ql.forEach(function(l, i){ x.fillText(l, C, y + 58 + i * 50); });
    y += qh;
    var cy = y + 290, R = 150, n = 5;
    function pt(i, rr){ var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + rr * Math.cos(a), cy + rr * Math.sin(a)]; }
    [0.25, 0.5, 0.75, 1].forEach(function(f){
      x.beginPath(); for (var i = 0; i < n; i++) { var p = pt(i, R * f); if (i) x.lineTo(p[0], p[1]); else x.moveTo(p[0], p[1]); } x.closePath();
      if (f === 1) { x.fillStyle = '#FFF7F0'; x.fill(); }
      x.strokeStyle = '#F2D6CC'; x.lineWidth = 2; x.stroke();
    });
    for (var i = 0; i < n; i++) { var p = pt(i, R); x.beginPath(); x.moveTo(C, cy); x.lineTo(p[0], p[1]); x.strokeStyle = '#F2D6CC'; x.stroke(); }
    x.beginPath(); r.stats.forEach(function(v, i){ var p = pt(i, R * v / 100); if (i) x.lineTo(p[0], p[1]); else x.moveTo(p[0], p[1]); }); x.closePath();
    x.fillStyle = 'rgba(233,130,114,.30)'; x.fill(); x.strokeStyle = '#E98272'; x.lineWidth = 5; x.lineJoin = 'round'; x.stroke();
    r.stats.forEach(function(v, i){ var p = pt(i, R * v / 100); x.beginPath(); x.arc(p[0], p[1], 8, 0, Math.PI * 2); x.fillStyle = '#E98272'; x.fill(); });
    r.stats.forEach(function(v, i){
      var p = pt(i, R + 50), al = Math.abs(p[0] - C) < 5 ? 'center' : p[0] > C ? 'left' : 'right';
      var dy = i === 0 ? -16 : 0;
      x.textAlign = al; x.fillStyle = '#574047'; x.font = '700 28px ' + F; x.fillText(STATS[i].nm, p[0], p[1] + dy);
      x.fillStyle = '#E98272'; x.font = '800 32px ' + F; x.fillText(String(v), p[0], p[1] + dy + 36);
    });
    x.textAlign = 'center';
    var sy = cy + R + 120, stl = '돈과의 관계 ' + (r.stage + 1) + '단계 · ' + STAGES[r.stage].nm;
    x.font = '800 32px ' + F; var sw = x.measureText(stl).width + 64;
    x.fillStyle = '#FCE8DF'; roundRect(x, C - sw / 2, sy - 42, sw, 62, 31); x.fill();
    x.fillStyle = '#574047'; x.fillText(stl, C, sy);
    // 카드 배경은 내용 높이에 맞춰 마지막에 깔고, 그 위에 내용을 다시 그린다
    var cardBottom = sy + 60;
    var g = c.getContext('2d');
    g.fillStyle = '#FFF7F0'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#FCE8DF'; g.beginPath(); g.arc(W - 90, 300, 210, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(80, 1690, 170, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#FFFFFF'; roundRect(g, 70, cardTop, W - 140, cardBottom - cardTop, 52); g.fill();
    g.drawImage(k, 0, 0);
    x = g; x.textAlign = 'center';
    var fy = cardBottom + 92;
    if (fy + 120 <= 1700) {
      x.fillStyle = '#574047'; x.font = '600 34px ' + F;
      x.fillText('돈을 대하는 마음을 이해하면', C, fy); x.fillText('삶의 선택이 달라집니다.', C, fy + 52); fy += 120;
    }
    x.fillStyle = '#E98272'; x.font = '800 36px ' + F; x.fillText('김새해의 5분 돈 감정 테스트', C, Math.min(fy, 1720));
    return c;
  });
}
function saveImage(){
  if (!last) return;
  if (!cardCanvas) { toast('이미지를 만들고 있어요. 잠시 뒤 다시 눌러 주세요.'); return; }
  var name = '김새해_돈감정테스트_' + TYPES[last.main].name.replace(/\s/g, '') + '.png';
  var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  cardCanvas.toBlob(function(blob){
    if (!blob) { toast('이미지를 만들지 못했어요.'); return; }
    var file = null; try { file = new File([blob], name, { type: 'image/png' }); } catch(e){}
    if (phone && file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: SHARE_TITLE }).catch(function(){}); return; }
    var url = URL.createObjectURL(blob);
    if (phone) { document.getElementById('modalImg').src = url; document.getElementById('modal').hidden = false; return; }
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('결과 이미지를 저장했어요.');
  }, 'image/png');
}
